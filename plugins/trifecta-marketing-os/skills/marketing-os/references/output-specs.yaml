# Trifecta Marketing OS: output specifications (single source of truth for sizes)
# Last verified: 2026-11-05. Review quarterly and after any posting error.
# Every image/video passes social-scheduler/scripts/preflight.py against these before upload.
#
# Key decision: Instagram feed and carousels use 4:5, not 3:4. Posts scheduled through
# Metricool publish via Instagram's API, which accepts 4:5 to 1.91:1; 3:4 risks crop/rejection.
# Keep critical content inside a centered 3:4 area because the profile grid previews at 3:4.

version: 1
formats:
  instagram_feed:
    network: instagram
    width: 1080
    height: 1350
    ratio: "4:5"
    file_types: [jpg, png]
    max_mb: 8
    color: sRGB
    safe_area: {type: center_ratio, ratio: "3:4", note: "grid preview crop; keep text, faces, logos inside"}
  instagram_carousel:
    network: instagram
    width: 1080
    height: 1350
    ratio: "4:5"
    slides: {min: 2, max: 10, same_ratio_all: true}
    file_types: [jpg, png]
    max_mb: 8
    color: sRGB
    safe_area: {type: center_ratio, ratio: "3:4", applies_to: first_slide}
  instagram_reel:
    network: instagram
    width: 1080
    height: 1920
    ratio: "9:16"
    file_types: [mp4, mov]
    codec: H.264
    fps: 30
    duration_sec: {min: 3, max: 90, target: [15, 30]}
    safe_area: {type: margins_px, top: 250, bottom: 340, left: 60, right: 120, note: "UI overlays; keep text and captions in the centered 1080x1420 zone"}
    cover: {width: 1080, height: 1920, ratio: "9:16", title_inside_center_ratio: "3:4"}
  instagram_story:
    network: instagram
    width: 1080
    height: 1920
    ratio: "9:16"
    file_types: [jpg, png, mp4]
    safe_area: {type: margins_px, top: 250, bottom: 340, left: 60, right: 60}
  linkedin_image:
    network: linkedin
    width: 1080
    height: 1350
    ratio: "4:5"
    alternates: [{width: 1200, height: 1200, ratio: "1:1"}]
    max_ratio_tall: "4:5"
    file_types: [jpg, png]
    max_mb: 5
  linkedin_carousel:
    network: linkedin
    deliverable: pdf
    page_width: 1080
    page_height: 1350
    ratio: "4:5"
    pages: {min: 3, max: 20, hard_max: 300}
    same_size_all_pages: true
    min_body_text_pt: 24
    max_mb: 100
  linkedin_link_preview:
    network: linkedin
    width: 1200
    height: 627
    ratio: "1.91:1"
    file_types: [jpg, png]
  google_business_post:
    network: google_business_profile
    width: 1200
    height: 900
    ratio: "4:3"
    file_types: [jpg, png]
    min_kb: 10
    max_mb: 5
    safe_area: {type: center_ratio, ratio: "1:1", note: "mobile previews crop tighter; no small text on image"}
    video: {max_sec: 30, max_mb: 75, min_height_px: 720}
    text: {max_chars: 1500}
  pinterest_pin:
    network: pinterest
    width: 1000
    height: 1500
    ratio: "2:3"
    file_types: [jpg, png]
    max_mb: 20
    text: {title_max: 100, description_max: 500}
  email_hero:
    network: email
    width: 1200
    height: 600
    ratio: "2:1"
    display_width_px: 600
    file_types: [jpg, png]
    max_kb: 500

text_limits:
  instagram_caption_max_chars: 2200
  instagram_caption_target_words: [80, 150]
  instagram_hashtags: {min: 3, max: 5}
  instagram_alt_text_max_chars: 100
  linkedin_post_max_chars: 3000
  email_subject_target_chars: [30, 50]
  email_preheader_target_chars: [40, 90]

tolerance:
  ratio_pct: 1.0      # allowed deviation from target ratio before preflight fails
  undersize_pct: 0    # never upscale; anything smaller than spec fails
